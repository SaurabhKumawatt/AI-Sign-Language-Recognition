<!DOCTYPE html>
<html>

<head>

    <title>Training Gesture</title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        img {
            margin-top: 20px;
            width: 700px;
            border-radius: 15px;
            border: 4px solid #00ff88;
        }

        h1 {
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <h1>
        Training Gesture: {{ gesture }}
    </h1>

    <h2>
        Show gesture continuously until collection completes
    </h2>

    <img src="{{ url_for('video') }}">
    <script>

        async function checkTraining() {

            try {

                const response = await fetch('/training_status');
                const data = await response.json();

                if (data.done) {

                    alert("Training Completed Successfully!");

                    window.location.href = "/";
                }

            } catch (err) {
                console.log(err);
            }
        }

        setInterval(checkTraining, 1000);

    </script>
</body>

</html>
